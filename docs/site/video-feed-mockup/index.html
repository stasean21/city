<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заметна в выдаче — варианты</title>
<style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Semibold.woff2); font-weight: 600; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; unicode-range: U+0000-00FF; }
:root { --bg:#F6F4F2; --bg-3:#ECEAE7; --ink:#1D1E22; --text:#717171; --text-3:#A1A09F; --accent:#F59958; --white:#fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font: 400 15px/25px Inter, sans-serif; color: var(--text); padding: 80px 0 120px; }
.container { max-width: 1248px; margin: 0 auto; padding: 0 24px; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--bg-3); font: 500 13px/20px Inter; color: var(--ink); }
.head { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; margin-bottom: 60px; }
h2 { font: 500 32px/1.25 Gilroy; letter-spacing: -.64px; color: var(--ink); margin-top: 16px; text-wrap: balance; }
h3 { font: 500 24px/1.25 Gilroy; letter-spacing: -.3px; color: var(--ink); text-wrap: balance; }
.lead { font-size: 17px; line-height: 28px; max-width: 520px; text-wrap: pretty; }
p { text-wrap: pretty; }

/* телефон */
.phone { padding: 12px; background: var(--ink); border-radius: 44px; width: 100%; max-width: 400px; }
.screen { height: 640px; overflow: hidden; background: var(--white); border-radius: 32px; display: flex; flex-direction: column; }
.search { margin: 12px 12px 8px; padding: 8px 14px; background: var(--bg-3); border-radius: 14px; color: var(--ink); font-size: 14px; }
.feed { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 8px; padding: 4px 12px 12px; }
.card .img { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--bg-3); }
.card .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .price { margin-top: 4px; font: 600 14px/20px Inter; color: var(--ink); }
.card .ln { display: block; height: 7px; margin-top: 5px; background: var(--bg-3); border-radius: 9px; }
.card .ln.s { width: 60%; }
.card.mine .img { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag { position: absolute; z-index: 3; top: 8px; left: 8px; padding: 0 8px; border-radius: 999px; background: var(--ink); color: #fff; font: 400 12px/22px Inter; display: inline-flex; gap: 6px; align-items: center; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: rec 1.2s steps(1) infinite; }
@keyframes rec { 50% { opacity: .2 } }
/* «видео»: кадры сменяются с лёгким приближением */
.vid img { animation: kb 6s ease-in-out infinite; opacity: 0; }
.vid img:nth-child(1) { animation-delay: 0s; } .vid img:nth-child(2) { animation-delay: 2s; } .vid img:nth-child(3) { animation-delay: 4s; }
@keyframes kb { 0% { opacity: 0; transform: scale(1) } 6% { opacity: 1 } 33% { opacity: 1; transform: scale(1.08) } 40% { opacity: 0 } 100% { opacity: 0 } }
.static .vid img { animation: none; } .static .vid img:first-child { opacity: 1; }

.cols { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; gap: 80px; align-items: center; }
.text p { margin: 12px 0 0; max-width: 520px; }
.facts { margin-top: 32px; display: grid; gap: 12px; max-width: 520px; }
.fact { display: grid; grid-template-columns: 28px 1fr; gap: 12px; color: var(--ink); }
.fact b { font: 500 13px/25px Inter; color: var(--accent); }
.note { margin-top: 28px; font-size: 13px; line-height: 20px; color: var(--text-3); max-width: 520px; }

/* v2: две ленты */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 840px; }
.pair .cap { margin-top: 16px; text-align: center; color: var(--ink); font: 500 15px/20px Inter; }
.pair .cap span { display: block; color: var(--text); font-weight: 400; font-size: 13px; }
.v2 { display: grid; grid-template-columns: 840px 1fr; gap: 60px; align-items: center; }
.v2 .screen { height: 560px; }

/* v3: широкая выдача */
.desk { background: var(--white); border-radius: 32px; padding: 20px 20px 0; overflow: hidden; height: 600px; position: relative; }
.desk .search { margin: 0 0 16px; font-size: 15px; padding: 10px 16px; max-width: 520px; }
.desk .feed { grid-template-columns: repeat(5, 1fr); gap: 20px 16px; padding: 0; }
.desk::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(transparent, #fff); }
.v3top { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; margin-bottom: 40px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
.chips span { padding: 4px 14px; border-radius: 999px; background: var(--bg-3); color: var(--ink); font: 500 13px/20px Inter; }

@media (max-width: 767px) {
  body { padding: 48px 0 80px; }
  .container { padding: 0 16px; }
  .head, .cols, .v2, .v3top { grid-template-columns: 1fr; gap: 24px; }
  .head { margin-bottom: 32px; }
  h2 { font-size: 26px; }
  .phone { margin: 0 auto; max-width: 340px; }
  .screen { height: 560px; }
  .pair { grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair .phone { padding: 6px; border-radius: 26px; } .pair .screen { height: 360px; border-radius: 20px; }
  .pair .search { font-size: 10px; padding: 4px 8px; margin: 6px 6px 4px; border-radius: 8px; }
  .pair .feed { gap: 8px 4px; padding: 2px 6px; } .pair .card .price { font-size: 10px; line-height: 14px; } .pair .card .ln { height: 4px; margin-top: 3px; }
  .pair .tag { font-size: 9px; line-height: 15px; padding: 0 5px; top: 4px; left: 4px; }
  .desk { padding: 12px 12px 0; border-radius: 24px; height: 560px; }
  .desk .feed { grid-template-columns: 1fr 1fr; gap: 14px 8px; }
  .desk .card:nth-child(n+7) { display: none; }
}
</style></head><body>
<div class="container" id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || '1'
// статичные карточки — мои работы (в макете — слайды купальника, на сайте — обложки инфографики)
const pics = ['ai-1','model-white','ai-3','layer-2','ai-4','source-white','ai-5','layer-3','model-scene','ai-2','layer-1','final']
const price = () => '— ₽'
const stat = (src) => `<div class="card"><div class="img"><img src="img/${src}.webp"></div><p class="price">${price()}</p><span class="ln"></span><span class="ln s"></span></div>`
const mine = (on = true) => `<div class="card ${on ? 'mine' : ''}"><div class="img vid">${on ? '<span class="tag"><i></i>видео</span>' : ''}<img src="img/final.webp"><img src="img/model-scene.webp"><img src="img/ai-2.webp"></div><p class="price">${price()}</p><span class="ln"></span><span class="ln s"></span></div>`
const feed = (n, at, on = true, list = pics) => Array.from({ length: n }, (_, i) => i === at ? mine(on) : stat(list[i % list.length])).join('')
const phone = (q, n, at, on = true, cls = '') => `<div class="phone ${cls}"><div class="screen"><div class="search">${q}</div><div class="feed">${feed(n, at, on)}</div></div></div>`
let html = ''

if (v === '1') {
  html = `
  <div class="head">
    <div><span class="pill">Примеры</span><h2>В выдаче двигается только ваша карточка</h2></div>
    <p class="lead">Остальные стоят на месте — поэтому взгляд сначала идёт к ней.</p>
  </div>
  <div class="cols">
    ${phone('купальник раздельный', 12, 2)}
    <div class="text">
      <h3>Глаз замечает движение раньше, чем текст</h3>
      <p>Покупатель листает выдачу быстро и почти не читает. Среди одинаково неподвижных фото карточка с видеообложкой — единственное, что шевелится. На ней он и останавливается.</p>
      <div class="facts">
        <div class="fact"><b>01</b><span>Работает без звука — в выдаче видео всегда беззвучное</span></div>
        <div class="fact"><b>02</b><span>Формат 3:4 — ролик встаёт ровно на место главного фото</span></div>
        <div class="fact"><b>03</b><span>Собираю из ваших фото товара — съёмка не нужна</span></div>
      </div>
      <p class="note">В ленте — мои работы: статичные карточки с инфографикой и одна видеообложка. Ленту можно прокрутить.</p>
    </div>
  </div>`
}

if (v === '2') {
  html = `
  <div class="head">
    <div><span class="pill">Примеры</span><h2>Одна выдача — с&nbsp;видеообложкой и&nbsp;без</h2></div>
    <p class="lead">Те же карточки, тот же товар. Справа главное&nbsp;фото заменено роликом.</p>
  </div>
  <div class="v2">
    <div class="pair">
      <div>${phone('купальник раздельный', 8, 2, false, 'static')}<p class="cap">Без видео<span>карточка теряется среди соседних</span></p></div>
      <div>${phone('купальник раздельный', 8, 2, true)}<p class="cap">С видеообложкой<span>её видно с первого взгляда</span></p></div>
    </div>
    <div class="text">
      <h3>Найдите свою карточку</h3>
      <p>Слева придётся присматриваться. Справа она находится сама — потому что двигается.</p>
      <p>Так же это работает в настоящей выдаче: покупатель не ищет вашу карточку, он просто замечает её первой.</p>
    </div>
  </div>`
}

if (v === '3') {
  html = `
  <div class="v3top">
    <div><span class="pill">Примеры</span><h2>Всё стоит, а ваша карточка — двигается</h2></div>
    <div>
      <p class="lead">Выдача — это стена похожих фото. Видеообложка единственная на ней живая, и взгляд цепляется за неё сам, без лишних слов.</p>
      <div class="chips"><span>3:4, как главное фото</span><span>без звука</span><span>6–10 секунд</span></div>
    </div>
  </div>
  <div class="desk"><div class="search">купальник раздельный</div><div class="feed">${feed(15, 2)}</div></div>`
}
document.getElementById('root').innerHTML = html
</script>
</body></html>
