<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заметна в выдаче — раунд 3</title>
<style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Semibold.woff2); font-weight: 600; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; unicode-range: U+0000-00FF; }
:root { --bg:#F6F4F2; --bg-3:#ECEAE7; --ink:#1D1E22; --ink-2:#2C2D32; --text:#717171; --text-3:#A1A09F; --accent:#F59958; --white:#fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font: 400 15px/25px Inter, sans-serif; color: var(--text); padding: 80px 0 120px; }
.container { max-width: 1248px; margin: 0 auto; padding: 0 24px; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--bg-3); font: 500 13px/20px Inter; color: var(--ink); }
h2 { font: 500 32px/1.25 Gilroy; letter-spacing: -.64px; color: var(--ink); margin-top: 16px; text-wrap: balance; }
h3 { font: 500 22px/1.3 Gilroy; letter-spacing: -.3px; color: var(--ink); text-wrap: balance; }
.lead { font-size: 17px; line-height: 28px; max-width: 520px; text-wrap: pretty; }
.head { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; margin-bottom: 56px; }

/* карточка маркетплейса */
.card .img { position: relative; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; background: var(--bg-3); }
.card .img > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; z-index: 3; top: 10px; left: 10px; padding: 0 10px; border-radius: 999px; background: var(--white); color: var(--ink); font: 500 12px/24px Inter; display: inline-flex; gap: 6px; align-items: center; }
.badge.on { background: var(--ink); color: #fff; }
.badge.on i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: rec 1.2s steps(1) infinite; }
.heart { position: absolute; z-index: 3; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--white); display: grid; place-items: center; }
.heart svg { width: 16px; height: 16px; }
@keyframes rec { 50% { opacity: .2 } }
.card .meta { margin-top: 10px; display: grid; gap: 6px; }
.card .meta b { font: 600 15px/20px Inter; color: var(--ink); }
.card .meta span { display: block; height: 8px; border-radius: 9px; background: var(--bg-3); }
.card .meta span.s { width: 60%; }
/* «ролик»: медленное приближение + сдвиг, будто камера едет */
.move > img { animation: cam 6s ease-in-out infinite alternate; transform-origin: 60% 40%; }
@keyframes cam { 0% { transform: scale(1) translate(0,0) } 100% { transform: scale(1.14) translate(-3%, 2%) } }
.bar { position: absolute; z-index: 3; left: 12px; right: 12px; bottom: 12px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.45); overflow: hidden; }
.bar::after { content: ""; position: absolute; inset: 0; background: var(--white); transform-origin: left; animation: prog 6s linear infinite; }
@keyframes prog { from { transform: scaleX(0) } to { transform: scaleX(1) } }

/* ---------- 4: лицом к лицу ---------- */
.duel { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 24px; align-items: start; }
.duel .card .img { border-radius: 24px; }
.duel .lbl { margin-top: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.duel .lbl b { font: 500 18px/24px Gilroy; color: var(--ink); }
.duel .lbl small { font-size: 13px; color: var(--text-3); }
.duel .side { align-self: center; padding-left: 36px; }
.duel .side p { margin-top: 12px; }
.duel .card.mine .img { outline: 2px solid var(--accent); outline-offset: 4px; }
.list { margin-top: 28px; display: grid; gap: 10px; }
.list li { list-style: none; display: grid; grid-template-columns: 24px 1fr; color: var(--ink); }
.list li::before { content: "/"; color: var(--accent); font: 500 15px Gilroy; }

/* ---------- 5: тёмная лента, соседи размыты ---------- */
.dark { background: var(--ink); border-radius: 40px; padding: 72px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 64px; align-items: center; overflow: hidden; }
.dark .pill { background: var(--ink-2); color: #B8B6B2; }
.dark h2 { color: #fff; }
.dark .lead { color: #A1A09F; margin-top: 20px; }
.wall { position: relative; height: 560px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 14%, #000 86%, transparent); }
.wall .track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; animation: up 22s linear infinite; }
@keyframes up { to { transform: translateY(-50%) } }
.wall .card .img { border-radius: 14px; }
.wall .card.dim .img > img { filter: grayscale(1) blur(3px) brightness(.55); }
.wall .card.dim .meta span { background: var(--ink-2); }
.wall .card .meta b { color: #fff; }
.wall .card.mine .img { outline: 2px solid var(--accent); outline-offset: 3px; }
.legend { margin-top: 32px; display: flex; gap: 24px; color: #fff; font-size: 14px; }
.legend i { display: inline-block; width: 22px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 8px; }

/* ---------- 6: что происходит за 6 секунд ---------- */
.story { display: grid; grid-template-columns: 360px 1fr; gap: 64px; align-items: center; }
.story .card .img { border-radius: 24px; }
.frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.frame .shot { aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: var(--bg-3); position: relative; }
.frame .shot img { position: absolute; width: 260%; max-width: none; }
.frame .t { margin-top: 14px; font: 500 13px/20px Inter; color: var(--accent); }
.frame b { display: block; margin-top: 2px; font: 500 18px/24px Gilroy; color: var(--ink); }
.frame p { margin-top: 6px; font-size: 14px; line-height: 22px; }
.timeline { margin: 28px 0 0; height: 4px; border-radius: 4px; background: var(--bg-3); position: relative; overflow: hidden; }
.timeline::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: left; animation: prog 6s linear infinite; }
.story .side h3 { margin-bottom: 28px; }

@media (max-width: 767px) {
  body { padding: 48px 0 80px; }
  .container { padding: 0 16px; }
  .head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 28px; }
  h2 { font-size: 26px; }
  .duel { grid-template-columns: 1fr 1fr; gap: 12px; }
  .duel .side { grid-column: 1 / -1; padding: 12px 0 0; }
  .duel .lbl { flex-direction: column; gap: 0; } .duel .lbl b { font-size: 16px; }
  .dark { grid-template-columns: 1fr; padding: 36px 20px 20px; border-radius: 27px; gap: 28px; }
  .wall { height: 460px; } .wall .track { gap: 8px; }
  .legend { flex-direction: column; gap: 8px; }
  .story { grid-template-columns: 1fr; gap: 28px; }
  .story .card { max-width: 300px; margin: 0 auto; width: 100%; }
  .frames { grid-template-columns: 1fr; gap: 20px; }
  .frame { display: grid; grid-template-columns: 96px 1fr; gap: 0 16px; align-items: start; }
  .frame .shot { grid-row: span 3; } .frame .t { margin-top: 0; }
}

/* ---------- раунд 3: светлая версия 5, скругления меньше ---------- */
.r3 .card .img, .r3 .wall .card .img { border-radius: 8px; }
.r3 .wall .card.mine .img { outline-offset: 2px; }
.light { background: var(--white); color: var(--text); }
.light .pill { background: var(--bg-3); color: var(--ink); }
.light h2 { color: var(--ink); }
.light .lead { color: var(--text); }
.light .wall .card.dim .img > img { filter: grayscale(1) blur(3px) opacity(.45); }
.light .wall .card .meta b { color: var(--ink); }
.light .wall .card.dim .meta span { background: var(--bg-3); }
.light .legend { color: var(--ink); }
.light .legend .sw { background: #D9D7D3 !important; }
.beige { background: var(--bg-2, #EFECE8); }
@media (max-width: 767px) {
  .v7 .light { background: var(--ink); }
  .v7 .light .pill { background: var(--ink-2); color: #B8B6B2; }
  .v7 .light h2 { color: #fff; } .v7 .light .lead { color: #A1A09F; }
  .v7 .light .wall .card.dim .img > img { filter: grayscale(1) blur(3px) brightness(.55); }
  .v7 .light .wall .card .meta b { color: #fff; } .v7 .light .wall .card.dim .meta span { background: var(--ink-2); }
  .v7 .light .legend { color: #fff; } .v7 .light .legend .sw { background: #3A3B40 !important; }
}
.r3 .heart { display: none; }
</style></head><body>
<div class="container" id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || '4'
const heart = `<span class="heart"><svg viewBox="0 0 24 24" fill="none" stroke="#1D1E22" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>`
const card = (src, { mine = false, dim = false, price = '— ₽' } = {}) => `
  <div class="card ${mine ? 'mine' : ''} ${dim ? 'dim' : ''}">
    <div class="img ${mine ? 'move' : ''}">${mine ? '<span class="badge on"><i></i>видео</span><span class="bar"></span>' : ''}${heart}<img src="img/${src}.webp"></div>
    <div class="meta"><b>${price}</b><span></span><span class="s"></span></div>
  </div>`
let html = ''

if (v === '4') {
  html = `
  <div class="head">
    <div><span class="pill">Примеры</span><h2>Какую карточку вы заметили первой?</h2></div>
    <p class="lead">Скорее всего, правую. Она двигается, а глаз реагирует на движение раньше, чем успевает прочитать текст.</p>
  </div>
  <div class="duel">
    <div>${card('fen')}<div class="lbl"><b>Фото</b><small>стоит на месте</small></div></div>
    <div>${card('vacuum', { mine: true })}<div class="lbl"><b>Видеообложка</b><small>двигается в выдаче</small></div></div>
    <div class="side">
      <h3>В выдаче десятки похожих фото</h3>
      <p>Покупатель пролистывает их, почти не вчитываясь. Видеообложка встаёт на место главного фото и оживает прямо в ленте. Карточку замечают раньше соседних.</p>
      <ul class="list"><li>3:4 — как главное фото карточки</li><li>Без звука — в ленте видео всегда беззвучное</li><li>Из ваших фото — съёмка не нужна</li></ul>
    </div>
  </div>`
}

if (v === '5') {
  const order = ['fen','final','vacuum','fen','vacuum','final','final','fen','vacuum']
  const mineAt = new Set([4])
  const cells = order.map((s, i) => card(s, { mine: mineAt.has(i), dim: !mineAt.has(i) })).join('')
  html = `
  <div class="dark">
    <div>
      <span class="pill">Примеры</span>
      <h2>Соседи сливаются в фон. Ваша карточка — нет</h2>
      <p class="lead">Когда покупатель листает выдачу, статичные карточки для него одинаковые. Видеообложка двигается — и выделяется из ряда без ярких плашек и громких обещаний.</p>
      <div class="legend"><span><i style="background:#3A3B40"></i>статичные карточки</span><span><i style="outline:2px solid #F59958;outline-offset:-2px"></i>с видеообложкой</span></div>
    </div>
    <div class="wall"><div class="track">${cells}${cells}</div></div>
  </div>`
}

if (v === '6') {
  const shot = (x, y) => `<div class="shot"><img src="img/vacuum.webp" style="left:${x}%;top:${y}%"></div>`
  html = `
  <div class="head">
    <div><span class="pill">Примеры</span><h2>Шесть секунд, чтобы карточку открыли</h2></div>
    <p class="lead">Видеообложка — не реклама, а главное фото, которое двигается. Каждая секунда отвечает на один вопрос покупателя.</p>
  </div>
  <div class="story">
    ${card('vacuum', { mine: true })}
    <div class="side">
      <div class="frames">
        <div class="frame">${shot(-10, -20)}<p class="t">0–2 с</p><b>Зацепка</b><p>Движение в первую секунду — взгляд останавливается в ленте</p></div>
        <div class="frame">${shot(-90, -120)}<p class="t">2–4 с</p><b>Товар крупно</b><p>Детали и масштаб — понятно, что именно покупают</p></div>
        <div class="frame">${shot(-130, -15)}<p class="t">4–6 с</p><b>Выгода</b><p>Одна главная причина купить — короткой фразой поверх</p></div>
      </div>
      <div class="timeline"></div>
    </div>
  </div>`
}

if (v === '7' || v === '8') {
  const order = ['fen','final','vacuum','fen','vacuum','final','final','fen','vacuum']
  const cells = order.map((s, i) => card(s, { mine: i === 4, dim: i !== 4 })).join('')
  document.body.classList.add('r3')
  html = `<div class="v${v}">
  <div class="dark light ${v === '8' ? 'beige' : ''}">
    <div>
      <span class="pill">Примеры</span>
      <h2>Соседи сливаются в фон. Ваша карточка — нет</h2>
      <p class="lead">Когда покупатель листает выдачу, статичные карточки для него одинаковые. Видеообложка двигается — и выделяется из ряда без ярких плашек и громких обещаний.</p>
      <div class="legend"><span><i class="sw" style="background:#3A3B40"></i>статичные карточки</span><span><i style="outline:2px solid #F59958;outline-offset:-2px"></i>с видеообложкой</span></div>
    </div>
    <div class="wall"><div class="track">${cells}${cells}</div></div>
  </div></div>`
}
document.getElementById('root').innerHTML = html
</script>
</body></html>
