<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — в работе</title>
<style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; unicode-range: U+0000-00FF; }
:root { --bg:#F6F4F2; --bg-3:#ECEAE7; --ink:#1D1E22; --text:#717171; --text-3:#A1A09F; --accent:#F59958; --blue:#3E7BFA; --hatch:#D9D5CF; --outline:#B8B4AE; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font: 400 15px/25px Inter, sans-serif; color: var(--text); overflow-x: hidden; }
.page { min-height: 100svh; display: flex; flex-direction: column; padding: 40px 96px 64px; position: relative; }
.top { display: flex; justify-content: space-between; align-items: center; }
.top img { height: 30px; }
.cap { font: 500 13px/20px Inter; color: var(--text-3); }

/* ---------- цифры ---------- */
.stage { position: relative; margin: 64px 0 0; padding: 40px 0 56px; }
.guide { position: absolute; left: -96px; right: -96px; height: 1px; background: var(--blue); opacity: .5; transform-origin: left; animation: gx .9s cubic-bezier(.65,0,.35,1) both; }
.guide.t { top: 40px; } .guide.b { bottom: 56px; animation-delay: .15s; }
@keyframes gx { from { transform: scaleX(0) } }
.d { display: flex; justify-content: center; font: 700 min(460px, 52vw)/0.8 Gilroy; letter-spacing: -.04em; user-select: none; }
.d > span { position: relative; display: inline-block; }
/* 4 — готово: заливка снизу вверх при входе */
.a { padding: 40px 40px 10px 0; margin: -40px -40px -10px 0; color: transparent; -webkit-text-stroke: 2px var(--ink);
  background: linear-gradient(var(--ink), var(--ink)) bottom / 100% 0% no-repeat; -webkit-background-clip: text; background-clip: text;
  animation: fillA 1.2s cubic-bezier(.65,0,.35,1) .5s forwards; }
@keyframes fillA { to { background-size: 100% 100% } }
/* 0 — в работе: неподвижная штриховка, заливка поднимается по клику */
.b { color: transparent; -webkit-text-stroke: 2px var(--ink); cursor: pointer;
  background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 14px); -webkit-background-clip: text; background-clip: text; }
.b .fill { position: absolute; left: 0; top: -40px; padding-top: 40px; color: var(--ink); -webkit-text-stroke: 0; clip-path: inset(calc(100% - var(--lvl, 0%)) 0 0 0); transition: clip-path .6s cubic-bezier(.22,1,.36,1); pointer-events: none; }
.b:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 8px; }
/* вторая 4 — в планах: только контур, его обводит курсор */
.c { color: transparent; -webkit-text-stroke: 2px var(--outline); }

.lbl { position: absolute; top: -30px; left: 12px; font: 500 12px/20px Inter; letter-spacing: 0; padding: 0 8px; border-radius: 4px; white-space: nowrap; -webkit-text-stroke: 0;
  opacity: 0; transform: translateY(6px); animation: pop .4s ease-out forwards; transition: background .3s, color .3s; }
.a .lbl { top: 10px; background: var(--blue); color: #fff; animation-delay: 1.2s; }
.b .lbl { background: var(--accent); color: #fff; animation-delay: 1.45s; }
.c .lbl { background: var(--bg-3); color: var(--text); animation-delay: 1.7s; }
.lbl.done { background: var(--blue) !important; color: #fff !important; }
@keyframes pop { to { opacity: 1; transform: none } }

/* подсказка у нуля */
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 500 13px/20px Inter; color: var(--text-3); white-space: nowrap; opacity: 0; animation: fade .4s ease-out 2.4s forwards; transition: opacity .3s; }
@keyframes fade { to { opacity: 1 } }
.hint b { color: var(--accent); font-weight: 500; }
.hint.gone { opacity: 0 !important; animation: none; }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 8px); font: 500 15px/22px Inter; color: var(--ink); background: #fff; border-radius: 12px; padding: 8px 16px; white-space: nowrap; opacity: 0; transition: opacity .4s, transform .4s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* перо курсора */
#pen { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#pen polyline { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; transition: opacity .3s; }
#cur { position: fixed; width: 26px; height: 26px; margin: -3px 0 0 -3px; pointer-events: none; transition: opacity .3s; }
#curname { position: fixed; font: 500 12px/20px Inter; color: #fff; background: var(--accent); border-radius: 6px; padding: 0 8px; white-space: nowrap; pointer-events: none; transition: opacity .3s; }

/* ---------- текст ---------- */
.msg { margin-top: auto; padding-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; }
h1 { font: 700 56px/1.08 Gilroy; letter-spacing: -1.5px; color: var(--ink); text-wrap: balance; }
.lead { font-size: 18px; line-height: 30px; max-width: 520px; text-wrap: pretty; margin-bottom: 28px; }
.acts { display: flex; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 15px; font: 500 16px Inter; white-space: nowrap; transition: transform .3s; }
.btn.dark { background: var(--ink); color: #fff; } .btn.sec { background: var(--bg-3); color: var(--ink); }
.btn.nudge { animation: nudge .9s ease-in-out 2; }
@keyframes nudge { 50% { transform: scale(1.06) } }
.rise { opacity: 0; transform: translateY(24px); animation: up .6s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes up { to { opacity: 1; transform: none } }

@media (max-width: 767px) {
  .page { padding: 20px 16px 24px; }
  .top img { height: 24px; }
  .stage { margin-top: 56px; padding: 32px 0 44px; }
  .guide { left: -16px; right: -16px; } .guide.t { top: 32px; } .guide.b { bottom: 44px; }
  .d { -webkit-text-stroke-width: 1.5px; }
  .lbl { top: -24px; left: 4px; font-size: 11px; line-height: 18px; padding: 0 6px; }
  .a .lbl { top: 16px; }
  .hint { font-size: 12px; bottom: 10px; }
  .toast { font-size: 13px; padding: 6px 12px; bottom: 6px; }
  .msg { grid-template-columns: 1fr; gap: 16px; padding-top: 24px; margin-top: 0; }
  h1 { font-size: 34px; letter-spacing: -.8px; }
  .lead { font-size: 16px; line-height: 26px; margin-bottom: 20px; }
  .acts { flex-direction: column; } .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } }
</style></head><body>
<div class="page">
  <div class="top"><img src="img/logo-light.svg" alt="m/design"><span class="cap">ошибка 404</span></div>
  <div class="stage">
    <span class="guide t"></span><span class="guide b"></span>
    <div class="d" aria-hidden="true">
      <span class="a">4<span class="lbl">готово</span></span><span class="b" id="zero" role="button" tabindex="0" aria-label="Доделать ноль">0<span class="fill">0</span><span class="lbl" id="zlbl">в работе</span></span><span class="c">4<span class="lbl" id="clbl">в планах</span></span>
    </div>
    <p class="hint" id="hint">нажмите на <b>0</b> — доделаем</p>
    <p class="toast" id="toast">Готово! Но этой страницы всё равно нет</p>
  </div>
  <div class="msg">
    <h1 class="rise" style="animation-delay:1.4s">Этой страницы нет. Или она ещё в работе</h1>
    <div>
      <p class="lead rise" style="animation-delay:1.5s">Ссылка могла устареть, а могла опередить события: часть страниц я ещё собираю. Всё готовое — на главной.</p>
      <div class="acts rise" style="animation-delay:1.6s"><a class="btn dark" id="home">На главную ↗</a><a class="btn sec">Все услуги</a></div>
    </div>
  </div>
</div>
<svg id="pen"><polyline points=""/></svg>
<svg id="cur" viewBox="0 0 22 22"><path d="M2 2 L20 9 L11 11 L9 20 Z" fill="#F59958" stroke="#fff" stroke-width="1.5"/></svg><span id="curname">Станислав</span>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

// ---- ноль: каждый клик поднимает заливку на шаг ----
const zero = document.getElementById('zero'), zlbl = document.getElementById('zlbl'), hint = document.getElementById('hint'), toast = document.getElementById('toast'), home = document.getElementById('home')
const STEPS = 4
let lvl = 0
function bump() {
  if (lvl >= STEPS) return
  lvl += 1
  zero.style.setProperty('--lvl', (lvl / STEPS) * 100 + '%')
  hint.classList.add('gone')
  if (lvl === STEPS) {
    zlbl.textContent = 'готово'; zlbl.classList.add('done')
    setTimeout(() => { toast.classList.add('on'); home.classList.add('nudge') }, 500)
  }
}
zero.addEventListener('click', bump)
zero.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump() } })

// ---- вторая 4: курсор обводит контур ----
// точки контура «4» в долях блока цифры (сняты с Gilroy Bold)
const R = { x: 855.9, y: 160, w: 248.8, h: 368 }
const PTS = [[1041,148],[935,355],[1017,355],[1017,280],[1082,280],[1082,355],[1117,355],[1117,414],[1082,414],[1082,470],[1017,470],[1017,414],[865,414],[865,355],[970,148],[1041,148]]
  .map(([x, y]) => [(x - R.x) / R.w, (y - R.y) / R.h])
const c = document.querySelector('.c'), clbl = document.getElementById('clbl')
const line = document.querySelector('#pen polyline'), cur = document.getElementById('cur'), nm = document.getElementById('curname')
const DRAW = 4200, HOLD = 1600, START = 2200
function pts() { const r = c.getBoundingClientRect(); return PTS.map(([fx, fy]) => [r.left + fx * r.width, r.top + fy * r.height]) }
let t0 = null
function tick(now) {
  requestAnimationFrame(tick)
  if (document.hidden) return
  if (t0 === null) t0 = now + START
  const t = now - t0
  if (t < 0) { cur.style.opacity = nm.style.opacity = 0; return }
  const P = pts(), seg = P.slice(1).map((p, i) => Math.hypot(p[0] - P[i][0], p[1] - P[i][1])), total = seg.reduce((a, b) => a + b)
  const cyc = DRAW + HOLD, k0 = t % cyc, done = k0 >= DRAW
  let d = Math.min(1, k0 / DRAW) * total, k = 0
  while (k < seg.length - 1 && d > seg[k]) { d -= seg[k]; k++ }
  const f = Math.min(1, d / seg[k]), x = P[k][0] + (P[k + 1][0] - P[k][0]) * f, y = P[k][1] + (P[k + 1][1] - P[k][1]) * f
  line.setAttribute('points', [...P.slice(0, k + 1), [x, y]].map(q => q.join(',')).join(' '))
  line.style.opacity = k0 > cyc - 300 ? 0 : 1
  cur.style.left = x + 'px'; cur.style.top = y + 'px'
  const flip = x + 22 + nm.offsetWidth > innerWidth - 8
  nm.style.left = (flip ? x - nm.offsetWidth - 6 : x + 22) + 'px'; nm.style.top = y + 18 + 'px'
  cur.style.opacity = nm.style.opacity = done ? 0 : 1
  clbl.textContent = done ? 'почти готово' : 'в работе'
  clbl.style.background = 'var(--accent)'; clbl.style.color = '#fff'
}
if (!reduce) document.fonts.ready.then(() => requestAnimationFrame(tick))
else { cur.remove(); nm.remove() }
</script>
</body></html>
