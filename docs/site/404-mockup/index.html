/* ---------- 5. Поиск ничего не нашёл — как на маркетплейсе, с подсказками ---------- */

  document.body.style.background = 'var(--bg)'

  html = `<div class="top"><img src="img/logo-light.svg"><span class="cap" style="color:var(--text-3)">ошибка 404</span></div>
  <div class="abs" style="left:96px;right:96px;top:120px;height:64px;background:#fff;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 10px 0 24px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A09F" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span style="font-size:18px;color:var(--ink)"><b style="font-weight:500;background:#FFE7D6;border-radius:4px;padding:0 4px">/эта-страница</b></span>

    <p class="cap" style="color:var(--accent)">Найдено: 0 страниц</p>
    <h1 style="margin-top:12px">${TITLE}</h1>
    <p class="lead" style="margin:20px 0 32px">${LEAD}</p>
    <div class="acts"><span class="btn dark">На главную ↗</span><span class="btn sec">Все услуги</span></div>

    <div style="margin-top:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px">

/* ---------- 6. 404 огромное, ноль перечёркнут слэшем из логотипа ---------- */
if (v === '6') {
  document.body.style.background = 'var(--bg)'
  css = `.big { font: 700 520px/0.8 Gilroy; letter-spacing: -26px; justify-content: center; color: var(--ink); display: flex; align-items: center; }

  <div class="abs big" style="left:0;right:0;top:130px"><span>4</span><span class="zero">0</span><span>4</span></div>
  <div class="abs" style="left:96px;top:620px;right:96px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end">

    <div><p class="lead" style="margin-bottom:28px">${LEAD}</p><div class="acts"><span class="btn dark">На главную ↗</span><span class="btn sec">Все услуги</span></div></div>

    background: url(img/fen.webp) 0% 40%/34% auto no-repeat, url(img/final.webp) 50% 30%/34% auto no-repeat, url(img/vacuum.webp) 100% 40%/34% auto no-repeat;

  <div class="abs mask" style="left:0;right:0;top:120px">404</div>
  <div class="abs" style="left:96px;top:600px;width:640px">

  </div>
  <div class="abs" style="left:800px;top:600px;width:544px">

    <div class="acts"><span class="btn light">На главную ↗</span><span class="btn sec-d">Все услуги</span></div>

/* ---------- 8. 404 в работе: чертёж, цифры собираются ---------- */
if (v === '8') {
  document.body.style.background = 'var(--bg)'
  css = `.d { font: 700 460px/0.8 Gilroy; letter-spacing: -18px; display: flex; justify-content: center; } .d > span { position: relative; display: inline-block; } .d .lbl { top: -30px; left: 12px; letter-spacing: 0; white-space: nowrap; -webkit-text-stroke: 0; }

  .d .b { color: transparent; -webkit-text-stroke: 2px var(--ink); background: repeating-linear-gradient(135deg, #D9D5CF 0 6px, transparent 6px 14px); -webkit-background-clip: text; background-clip: text; }

  .guide { position: absolute; background: var(--blue); opacity: .55; }
  .lbl { position: absolute; font: 500 12px/20px Inter; padding: 0 8px; border-radius: 4px; }`
  html = `<div class="top"><img src="img/logo-light.svg"><span class="cap" style="color:var(--text-3)">ошибка 404</span></div>
  <div class="guide" style="left:0;right:0;top:160px;height:1px"></div>
  <div class="guide" style="left:0;right:0;top:528px;height:1px"></div>
  <div class="abs d" style="left:0;right:0;top:160px"><span class="a">4<span class="lbl" style="background:var(--blue);color:#fff">готово</span></span><span class="b">0<span class="lbl" style="background:var(--accent);color:#fff">в работе</span></span><span class="c">4<span class="lbl" style="background:var(--bg-3);color:var(--text)">в планах</span><svg style="position:absolute;right:30px;top:140px" width="26" height="26" viewBox="0 0 22 22"><path d="M2 2 L20 9 L11 11 L9 20 Z" fill="#F59958" stroke="#fff" stroke-width="1.5"/></svg></span></div>

// v1: матрица точек, из которых собрано «404»
if (v === '1') {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), W = 1440, H = 900
  cv.width = W * 2; cv.height = H * 2; ctx.scale(2, 2)
  const off = document.createElement('canvas'); off.width = W; off.height = H
  const o = off.getContext('2d'); o.fillStyle = '#000'; o.font = '700 440px Gilroy'; o.textAlign = 'right'; o.textBaseline = 'alphabetic'
  o.fillText('404', W - 80, 560)
  const data = o.getImageData(0, 0, W, H).data, step = 16, dots = []
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) dots.push({ x, y, on: data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128 })
  const ptr = { x: 1080, y: 380 }
  addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY })
  function frame(t) {
    ctx.clearRect(0, 0, W, H)
    for (const d of dots) {
      const dx = d.x - ptr.x, dy = d.y - ptr.y, dist = Math.hypot(dx, dy), near = Math.max(0, 1 - dist / 150)
      const push = near * near * 26, x = d.x + (dist ? dx / dist * push : 0), y = d.y + (dist ? dy / dist * push : 0)
      ctx.fillStyle = d.on ? (near > .05 ? `rgba(245,153,88,${.5 + near * .5})` : '#F6F4F2') : (near > .05 ? `rgba(245,153,88,${near * .7})` : '#2E2F34')
      ctx.beginPath(); ctx.arc(x, y, d.on ? 3.2 + near * 2 : 1.6 + near * 2, 0, 6.283); ctx.fill()
    }
    requestAnimationFrame(frame)
  }
  document.fonts.ready.then(() => { o.clearRect(0, 0, W, H); o.fillText('404', W - 80, 560); const dd = o.getImageData(0, 0, W, H).data; dots.forEach(d => d.on = dd[(Math.floor(d.y) * W + Math.floor(d.x)) * 4 + 3] > 128); requestAnimationFrame(frame) })
}
</script>
