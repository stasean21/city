<title>Документы и cookie</title>
<style>

@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }

:root { --bg:#F6F4F2; --bg-3:#ECEAE7; --ink:#1D1E22; --ink-2:#2C2D32; --text:#717171; --text-3:#A1A09F; --line:#E2DFDB; --accent:#F59958; --white:#fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font: 400 15px/25px Inter, sans-serif; color: var(--text); }
.header { margin: 24px 96px 0; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }

.container { max-width: 1248px; margin: 0 auto; padding: 0 24px; }

.date { font: 500 13px Inter; color: var(--text-3); }

.toc { position: sticky; top: 24px; background: #fff; border-radius: 20px; padding: 20px; }
.toc p { font: 500 13px Inter; color: var(--text-3); margin-bottom: 8px; }

.toc a.on { background: var(--bg-3); color: var(--ink); font-weight: 500; }

.body { max-width: 680px; }
.body h2 { font: 500 26px/1.25 Gilroy; letter-spacing: -.5px; color: var(--ink); margin: 48px 0 16px; display: flex; gap: 12px; align-items: baseline; scroll-margin-top: 100px; }

.cb .box.on { background: var(--ink); border-color: var(--ink); }
.cb .box.on::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }

.states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
.st { background: #fff; border-radius: 20px; padding: 20px; }
