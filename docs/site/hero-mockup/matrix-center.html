<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero — точечная матрица</title>
<style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
:root { --bg:#F6F4F2; --ink:#1D1E22; --ink-soft:#2C2D32; --text:#717171; --dt:#B8B6B2; --accent:#F59958; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: Gilroy, system-ui, sans-serif; color: var(--ink); }
header { margin: 24px 96px 0; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }
header img { height: 28px; }
header nav { margin-left: auto; display: flex; gap: 40px; font: 500 16px Gilroy; color: var(--text); margin-right: 32px; }
.hbtn { height: 48px; padding: 0 20px; border-radius: 15px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; font: 500 16px Gilroy; }
.cap { position: relative; margin: 20px 96px 40px; height: min(720px, calc(100vh - 128px)); min-height: 560px; border-radius: 40px; background: var(--ink); overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.content { position: relative; z-index: 2; padding: 96px 72px; max-width: 820px; pointer-events: none; }
.content > * { pointer-events: auto; }
.pill { display: inline-flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 999px; background: var(--ink-soft); color: var(--dt); font: 500 15px Gilroy; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3BB273; }
h1 { font: 700 56px/1.12 Gilroy; letter-spacing: -1.5px; color: #fff; margin: 26px 0 40px; }
.input { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 27px; padding: 10px 10px 10px 24px; font: 500 20px Gilroy; max-width: 640px; }
.input input { flex: 1; border: 0; outline: 0; font: inherit; background: none; min-width: 0; }
.go { width: 52px; height: 52px; border-radius: 15px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
.acts { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 15px; background: var(--ink-soft); color: #fff; font: 500 17px Gilroy; }
.btn.acc { background: var(--accent); color: var(--ink); }
@media (max-width: 767px) {
  header { margin: 12px 12px 0; height: 56px; padding: 0 8px 0 18px; } header nav, .hbtn { display: none; }
  .cap { margin: 12px; height: calc(100svh - 92px); min-height: 600px; border-radius: 27px; display: flex; align-items: flex-end; }
  .content { padding: 32px 20px 28px; }
  h1 { font-size: 34px; margin: 18px 0 24px; letter-spacing: -.8px; }
  .input { font-size: 17px; padding-left: 18px; } .go { width: 46px; height: 46px; }
  .acts { flex-direction: column; }
  .btn { justify-content: center; height: 50px; font-size: 16px; }
}

/* общие для центровки */
.content { max-width: none; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; }
.input { width: 640px; max-width: 100%; text-align: left; }
.input .ar, .bar .ar { color: #A1A09F; }
.acts { justify-content: center; }
h1 { font-size: 60px; }
/* 2 — одна строка-команда */
.v2 h1 { font-size: 66px; letter-spacing: -2px; margin-bottom: 44px; white-space: nowrap; }
.bar { display: flex; align-items: center; gap: 14px; width: 760px; max-width: 100%; background: #fff; border-radius: 27px; padding: 10px 10px 10px 24px; font: 500 20px Gilroy; text-align: left; }
.bar input { flex: 1; border: 0; outline: 0; font: inherit; background: none; min-width: 0; }
.link { margin-top: 18px; display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 15px; border: 1.5px solid #4A4B50; color: #fff; font: 500 17px Gilroy; }
.only-mob { display: none; }
/* мобильный «хром» сайта: логотип сверху без панели, нижняя панель Меню/Обсудить, ярлык подарка */
.dock, .gift { display: none; }
/* 3 — разнесено по высоте */
.v3 .content { justify-content: space-between; padding: 44px 40px 40px; }
.v3 h1 { margin-top: 0; }
.v3 .mid { width: 100%; display: flex; flex-direction: column; align-items: center; }
@media (max-width: 767px) {
  .content { padding: 28px 18px; height: 100%; }
  h1, .v2 h1 { font-size: 32px; letter-spacing: -.8px; margin: 18px 0 24px; }
  .v2 h1 { font-size: 34px; white-space: normal; }
  .bar { flex-wrap: wrap; padding: 10px; font-size: 17px; }
  .bar input { padding: 10px 8px; }
  .only-pc { display: none !important; } .only-mob { display: grid; }
  .bar { flex-wrap: nowrap; padding: 8px 8px 8px 16px; }
  .link { width: 100%; justify-content: center; height: 50px; }
  header { background: none; margin: 0; padding: 26px 24px 0; height: auto; }
  header img { height: 26px; }
  .v2 .cap { height: calc(100svh - 74px - 104px); min-height: 520px; margin: 14px 12px 0; }
  .dock { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; height: 68px; padding: 7px; gap: 7px; border-radius: 30px; background: #1D1E22; z-index: 30; }
  .dock span { display: flex; align-items: center; justify-content: center; border-radius: 23px; font: 500 17px Gilroy; }
  .dock .m { width: 112px; background: #2C2D32; color: #fff; } .dock .d { flex: 1; background: #fff; color: #1D1E22; }
  .gift { display: flex; position: fixed; right: 12px; bottom: 92px; z-index: 30; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 15px; background: #1D1E22; color: #fff; font: 500 15px Gilroy; }
  .gift b { background: #F59958; color: #1D1E22; border-radius: 999px; padding: 1px 8px; font: 500 13px Gilroy; }
  .v3 .content { padding: 22px 18px 18px; }
  .cap { align-items: stretch; }
  .acts { width: 100%; }
  .acts .btn { width: 100%; }
  .v3 .bottom { width: 100%; }
}
</style></head><body>
<header><img src="img/logo-light.svg"><nav><span>Услуги</span><span>Этапы работы</span><span>Отзывы</span><span>Обо мне</span><span>FAQ</span></nav><span class="hbtn">Обсудить задачу ↗</span></header>
<section class="cap" id="cap">
  <canvas id="cv"></canvas>
  <div class="content" id="content"></div>
</section>
<div class="dock"><span class="m">☰ Меню</span><span class="d">Обсудить задачу ↗</span></div><div class="gift"><span style="color:#F59958">🎁</span>Ваш подарок <b>4</b></div>
<script>
const V = new URLSearchParams(location.search).get('v') || '1'
document.body.classList.add('v' + V)
const pill = '<span class="pill"><span class="dot"></span>Отвечаю лично — без менеджеров</span>'
const h1 = '<h1>Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>'
const inp = (extra = '') => `<div class="input"><span class="ar">→</span><input placeholder="Конкуренты дороже, а покупают у них">${extra}<span class="go">↑</span></div>`
const acts = '<div class="acts"><span class="btn acc">Услуги и решения ↗</span><span class="btn">Обсудить задачу ↗</span></div>'
document.getElementById('content').innerHTML = {
  '1': pill + h1 + inp() + acts,
  '2': h1 + `<div class="bar"><span class="ar">→</span><input placeholder="Конкуренты дороже, а покупают у них"><span class="btn acc only-pc">Обсудить задачу ↗</span><span class="go only-mob">↑</span></div><a class="link">Услуги и решения ↓</a>`,
  '3': `<div class="top">${pill}</div><div class="mid">${h1}${inp()}</div><div class="bottom">${acts}</div>`,
}[V]
</script>
<script>
// Точечная матрица: спокойное поле точек.
// ПК — точки у курсора расходятся, вырастают и вспыхивают оранжевым.
// Телефон — курсора нет: «невидимый палец» сам медленно гуляет по матрице,
// касание пальцем работает как курсор.
const cv = document.getElementById('cv'), cap = document.getElementById('cap'), ctx = cv.getContext('2d')
const TAN = 315 / 957
let W, H, dpr, step, dots = [], mobile
const ptr = { x: -999, y: -999, active: false, t: 0 }
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2)
  W = cap.clientWidth; H = cap.clientHeight
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  mobile = W < 700
  step = mobile ? 16 : 22
  dots = []
  // на ПК матрица справа от текста, на телефоне — полосой внизу
  // поле на всю капсулу, и под текстом тоже
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) dots.push({ x, y })
}
function frame(t) {
  t /= 1000
  ctx.clearRect(0, 0, W, H)
  // на телефоне или без мыши — точка «гуляет» сама по восьмёрке
  let px = ptr.x, py = ptr.y
  if (!ptr.active) {
    px = W * 0.5 + Math.sin(t * 0.5) * W * 0.4
    py = H * 0.5 + Math.sin(t * 0.9) * H * 0.38
  }
  const R = mobile ? 90 : 140
  for (const d of dots) {
    const dx = d.x - px, dy = d.y - py, dist = Math.hypot(dx, dy)
    const near = Math.max(0, 1 - dist / R)
    // точки у курсора расходятся в стороны, вырастают и загораются оранжевым
    const push = near * near * (mobile ? 14 : 22)
    const x = d.x + (dist ? dx / dist * push : 0), y = d.y + (dist ? dy / dist * push : 0)
    const r = 1.6 + near * 3.4
    ctx.fillStyle = near > 0.04 ? `rgba(245,153,88,${0.25 + near * 0.75})` : '#303136'
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill()
  }
  requestAnimationFrame(frame)
}
cap.addEventListener('pointermove', (e) => { const r = cap.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.active = true })
cap.addEventListener('pointerleave', () => { ptr.active = false })
cap.addEventListener('touchend', () => { ptr.active = false })
addEventListener('resize', layout)
const qp = new URLSearchParams(location.search); if (qp.has('px')) { ptr.x = +qp.get('px'); ptr.y = +qp.get('py'); ptr.active = true }
document.fonts.ready.then(() => { layout(); requestAnimationFrame(frame) })
</script>
</body></html>
