<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Semibold.woff2); font-weight: 600; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; unicode-range: U+0000-00FF; }
:root { --bg:#F6F4F2; --bg-3:#EAE8E4; --ink:#1D1E22; --ink-soft:#2C2D32; --text:#717171; --text-3:#A1A09F; --dt:#B8B6B2; --accent:#F59958; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; height: 900px; overflow: hidden; position: relative; background: var(--bg); font-family: Inter, sans-serif; color: var(--ink); }
header { position: absolute; z-index: 20; left: 96px; right: 96px; top: 46px; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }
header img { height: 28px; }
header nav { margin-left: auto; display: flex; gap: 48px; font: 500 17px Inter; color: var(--text); margin-right: 40px; }
.btn { display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-radius: 15px; background: var(--ink); color: #fff; font: 500 17px Inter; white-space: nowrap; }
.btn.sec { background: #fff; color: var(--ink); }
.btn.acc { background: var(--accent); color: var(--ink); }
h1 { font: 700 58px/1.12 Gilroy; letter-spacing: -1.5px; }
.abs { position: absolute; }
.input { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 27px; padding: 12px 12px 12px 26px; font: 500 22px Gilroy; color: var(--ink); width: 820px; margin: 0 auto; text-align: left; }
.input .ar { color: var(--text-3); }
.input .go { margin-left: auto; width: 56px; height: 56px; border-radius: 15px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
.caret { display: inline-block; width: 3px; height: 28px; background: var(--accent); vertical-align: -5px; margin-left: 2px; }
.acts { display: flex; gap: 12px; justify-content: center; }
.tile { position: absolute; padding: 18px 20px; border-radius: 20px; width: 230px; font: 400 15px/22px Inter; }
.tile b { display: block; font: 700 30px/1.05 Gilroy; letter-spacing: -.8px; margin-bottom: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style></head><body>
<header><img id="logo" src="img/logo-light.svg"><nav><span>Услуги</span><span>Этапы работы</span><span>Отзывы</span><span>Обо мне</span><span>FAQ</span></nav><span class="btn" style="height:48px">Обсудить задачу ↗</span></header>
<script>
const v = new URLSearchParams(location.search).get('v') || '1'
const input = (text = 'Конкуренты дороже, а покупают у них', go = '↑') => `<div class="input"><span class="ar">→</span>${text}<span class="caret"></span><span class="go">${go}</span></div>`
const H = {
  // A — вокруг поля «ответы»-факты: цвет и наполненность
  '1': `<div class="abs" style="left:0;right:0;top:290px;text-align:center"><h1>Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>
      <div style="margin-top:44px">${input()}</div>
      <div class="acts" style="margin-top:22px"><span class="btn">Услуги и решения ↗</span><span class="btn sec">Обсудить задачу ↗</span></div></div>
    <div class="tile" style="left:110px;top:150px;background:var(--accent);transform:rotate(-6deg)"><b>до 24 ч</b>главный слайд для карточки</div>
    <div class="tile" style="left:150px;top:680px;background:var(--ink);color:var(--dt);transform:rotate(4deg)"><b style="color:#fff">75 ₽</b>ИИ-фото товара — от этой цены</div>
    <div class="tile" style="right:110px;top:146px;background:#fff;transform:rotate(5deg)"><b>1 смета</b>сумма фиксируется после брифа и не растёт</div>
    <div class="tile" style="right:150px;top:690px;background:#E7E1F5;transform:rotate(-4deg)"><b>лично</b>без менеджеров — пишете сразу мне</div>`,
  // B — тёмная капсула
  '2': `<div class="abs" style="left:96px;right:96px;top:140px;height:720px;border-radius:40px;background:var(--ink);overflow:hidden">
      <div class="abs" style="right:-60px;top:-80px;font:700 760px/1 Gilroy;color:#26272C;letter-spacing:-40px">/</div>
      <div class="abs" style="left:0;right:0;top:110px;text-align:center">
        <span style="display:inline-flex;gap:10px;align-items:center;padding:8px 16px;border-radius:999px;background:var(--ink-soft);color:var(--dt);font:500 15px Inter"><span class="dot" style="background:#3BB273"></span>Отвечаю лично — без менеджеров</span>
        <h1 style="color:#fff;margin-top:26px">Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>
        <div style="margin-top:42px">${input()}</div>
        <div class="acts" style="margin-top:22px"><span class="btn acc">Услуги и решения ↗</span><span class="btn" style="background:var(--ink-soft)">Обсудить задачу ↗</span></div></div></div>`,
  // C — оранжевый фон
  '3': `<div class="abs" style="inset:0;background:var(--accent)"></div>
    <div class="abs" style="left:-40px;right:-40px;bottom:-120px;text-align:center;font:700 330px/1 Gilroy;letter-spacing:-14px;color:#F2A06A">m/design</div>
    <div class="abs" style="left:0;right:0;top:220px;text-align:center"><h1 style="font-size:66px">Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>
      <div style="margin-top:44px">${input()}</div>
      <div class="acts" style="margin-top:22px"><span class="btn">Услуги и решения ↗</span><span class="btn sec">Обсудить задачу ↗</span></div></div>`,
  // D — под полем выезжает ответ, кнопки внутри ответа
  '4': `<div class="abs" style="left:0;right:0;top:200px;text-align:center"><h1>Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>
      <div style="margin-top:44px">${input('Конкуренты дороже, а покупают у них', '✓')}</div>
      <div style="width:820px;margin:14px auto 0;padding:22px;border-radius:27px;background:var(--ink);color:#fff;text-align:left;display:flex;gap:18px;align-items:flex-start">
        <img src="img/photo.webp" style="width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none">
        <div style="flex:1"><div style="font:500 14px Inter;color:var(--dt)">Станислав · отвечу лично</div>
          <div style="font:500 21px/30px Gilroy;margin:6px 0 18px">Знакомо. Обычно дело в главном слайде — разберу вашу карточку и предложу решение.</div>
          <div style="display:flex;gap:10px"><span class="btn acc">Отправить в Telegram ↗</span><span class="btn" style="background:var(--ink-soft)">Посмотреть услуги</span></div></div></div></div>`,
}
document.write(H[v])
</script>
</body></html>
