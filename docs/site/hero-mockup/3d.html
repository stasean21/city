<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Semibold.woff2); font-weight: 600; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
:root { --ink:#1D1E22; --accent:#F59958; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; height: 900px; overflow: hidden; position: relative; font-family: Gilroy, sans-serif; }
canvas { position: absolute; inset: 0; }
header { position: absolute; z-index: 20; left: 96px; right: 96px; top: 46px; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }
header img { height: 28px; }
header nav { margin-left: auto; display: flex; gap: 48px; font: 500 17px Gilroy; color: #717171; margin-right: 40px; }
.btn { display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-radius: 15px; background: var(--ink); color: #fff; font: 500 17px Gilroy; white-space: nowrap; }
.btn.sec { background: #fff; color: var(--ink); }
.txt { position: absolute; z-index: 10; }
h1 { font: 700 62px/1.08 Gilroy; letter-spacing: -2px; }
.sub { font: 500 19px/31px Gilroy; margin-top: 26px; }
.acts { display: flex; gap: 12px; margin-top: 36px; }
.dark header { background: #2C2D32; } .dark header nav { color: #B8B6B2; } .dark h1 { color: #fff; } .dark .sub { color: #B8B6B2; }
.dark .btn { background: #fff; color: var(--ink); } .dark .btn.sec { background: #2C2D32; color: #fff; }
</style>
<script type="importmap">{ "imports": { "three": "./three/three.module.min.js" } }</script>
</head><body>
<header><img id="logo" src="img/logo-light.svg"><nav><span>Услуги</span><span>Этапы работы</span><span>Отзывы</span><span>Обо мне</span><span>FAQ</span></nav><span class="btn" style="height:48px">Обсудить задачу ↗</span></header>
<div class="txt" id="txt"></div>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from './three/RoomEnvironment.js'
const v = new URLSearchParams(location.search).get('v') || '1'
const sub = 'Собираю визуал, сайты и автоматизацию так, чтобы всё работало вместе — от первого показа в выдаче до первого заказа.'
const acts = (j = 'flex-start') => `<div class="acts" style="justify-content:${j}"><span class="btn">Услуги и решения ↗</span><span class="btn sec">Обсудить задачу ↗</span></div>`

const CFG = {
  '1': { bg: '#F6F4F2', slash: '#F59958', ped: '#E8E2DA', ball: '#1D1E22', cam: [-1.2, 2.4, 14], look: [-1.2, 1.7, 0], gx: 2.3 },
  '2': { bg: '#1D1E22', slash: '#F59958', ped: '#2C2D32', ball: '#F6F4F2', cam: [-1.2, 2.4, 14], look: [-1.2, 1.7, 0], gx: 2.3, dark: true },
  '3': { bg: '#F59958', slash: '#F6F4F2', ped: '#1D1E22', ball: '#1D1E22', cam: [0, 4.6, 16], look: [0, 4.2, 0], gx: 0 },
}[v]
document.body.style.background = CFG.bg
if (CFG.dark) { document.body.classList.add('dark'); document.getElementById('logo').src = 'img/logo-dark.svg' }

const txt = document.getElementById('txt')
if (v === '3') {
  txt.style.cssText = 'left:0;right:0;top:170px;text-align:center'
  txt.innerHTML = `<h1 style="color:#1D1E22">Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1>${acts('center')}`
} else {
  txt.style.cssText = 'left:96px;top:250px;width:620px'
  txt.innerHTML = `<h1>Дизайн, аналитика<br>и ИИ-разработка<br>для малого и среднего<br>бизнеса</h1><p class="sub" style="color:${CFG.dark ? '#B8B6B2' : '#717171'};max-width:520px">${sub}</p>${acts()}`
}

const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setPixelRatio(1); r.setSize(1440, 900)
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0
r.outputColorSpace = THREE.SRGBColorSpace
document.body.prepend(r.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(CFG.bg)
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = CFG.dark ? 0.5 : 0.9

const cam = new THREE.PerspectiveCamera(30, 1440 / 900, 0.1, 100)
cam.position.set(...CFG.cam); cam.lookAt(...CFG.look)
// смещаем объект вправо, освобождая место под текст

const key = new THREE.DirectionalLight(0xffffff, CFG.dark ? 2.4 : 2.0)
key.position.set(-4, 7, 5); key.castShadow = true
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6
scene.add(key)
if (CFG.dark) { const rim = new THREE.DirectionalLight(0xF59958, 3); rim.position.set(5, 3, -4); scene.add(rim) }

// пол, принимающий только тень
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: CFG.dark ? 0.5 : 0.16 }))
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor)

// слэш — параллелограмм как в логотипе, со скруглённой фаской
const TAN = 315 / 957, H = 3.6, W = 0.62
const sh = new THREE.Shape()
sh.moveTo(-H / 2 * TAN - W / 2, -H / 2); sh.lineTo(H / 2 * TAN - W / 2, H / 2); sh.lineTo(H / 2 * TAN + W / 2, H / 2); sh.lineTo(-H / 2 * TAN + W / 2, -H / 2); sh.closePath()
const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 10, curveSegments: 12 })
geo.center()
const mat = (c, rough = 0.32, cc = 0.6) => new THREE.MeshPhysicalMaterial({ color: c, roughness: rough, clearcoat: cc, clearcoatRoughness: 0.25 })
const slash = new THREE.Mesh(geo, mat(CFG.slash))
slash.castShadow = true; slash.receiveShadow = true

// подиум
const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.42, 96), mat(CFG.ped, 0.55, 0.2))
ped.position.y = 0.21; ped.castShadow = true; ped.receiveShadow = true; scene.add(ped)
slash.position.set(0, 0.42 + H / 2 + 0.12, 0); slash.rotation.y = -0.45
scene.add(slash)
// шар
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 64), mat(CFG.ball, 0.18, 1))
ball.position.set(1.05, 0.42 + 0.42, 0.75); ball.castShadow = true; scene.add(ball)
// второй малый подиум-ступень
const step = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.26, 96), mat(CFG.ped, 0.55, 0.2))
step.position.set(-1.9, 0.13, 0.9); step.castShadow = true; step.receiveShadow = true; scene.add(step)
const cube = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.62), mat(v === '3' ? '#F6F4F2' : CFG.slash, 0.3, 0.6))
cube.position.set(-1.9, 0.26 + 0.31, 0.9); cube.rotation.y = 0.6; cube.castShadow = true; scene.add(cube)

;[ped, step, cube, ball, slash].forEach(m => { m.position.x += CFG.gx })

r.render(scene, cam)
window.ready = true
</script>
</body></html>
