<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero — точечная матрица</title>
<style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
:root { --bg:#F6F4F2; --ink:#1D1E22; --ink-soft:#2C2D32; --text:#717171; --dt:#B8B6B2; --accent:#F59958; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: Gilroy, system-ui, sans-serif; color: var(--ink); }
header { margin: 24px 96px 0; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }
header img { height: 28px; }
header nav { margin-left: auto; display: flex; gap: 40px; font: 500 16px Gilroy; color: var(--text); margin-right: 32px; }
.hbtn { height: 48px; padding: 0 20px; border-radius: 15px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; font: 500 16px Gilroy; }
.cap { position: relative; margin: 20px 96px 40px; height: min(720px, calc(100vh - 128px)); min-height: 560px; border-radius: 40px; background: var(--ink); overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.content { position: relative; z-index: 2; padding: 96px 72px; max-width: 820px; pointer-events: none; }
.content > * { pointer-events: auto; }
.pill { display: inline-flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 999px; background: var(--ink-soft); color: var(--dt); font: 500 15px Gilroy; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3BB273; }
h1 { font: 700 56px/1.12 Gilroy; letter-spacing: -1.5px; color: #fff; margin: 26px 0 40px; }
.input { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 27px; padding: 10px 10px 10px 24px; font: 500 20px Gilroy; max-width: 640px; }
.input input { flex: 1; border: 0; outline: 0; font: inherit; background: none; min-width: 0; }
.go { width: 52px; height: 52px; border-radius: 15px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
.acts { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 15px; background: var(--ink-soft); color: #fff; font: 500 17px Gilroy; }
.btn.acc { background: var(--accent); color: var(--ink); }
@media (max-width: 767px) {
  header { margin: 12px 12px 0; height: 56px; padding: 0 8px 0 18px; } header nav, .hbtn { display: none; }
  .cap { margin: 12px; height: auto; min-height: 0; border-radius: 27px; }
  .content { padding: 28px 20px 300px; }
  h1 { font-size: 34px; margin: 18px 0 24px; letter-spacing: -.8px; }
  .input { font-size: 17px; padding-left: 18px; } .go { width: 46px; height: 46px; }
  .acts { flex-direction: column; }
  .btn { justify-content: center; height: 50px; font-size: 16px; }
  .content { padding-bottom: 260px; }
}
</style></head><body>
<header><img src="img/logo-light.svg"><nav><span>Услуги</span><span>Этапы работы</span><span>Отзывы</span><span>Обо мне</span><span>FAQ</span></nav><span class="hbtn">Обсудить задачу ↗</span></header>
<section class="cap" id="cap">
  <canvas id="cv"></canvas>
  <div class="content">
    <span class="pill"><span class="dot"></span>Отвечаю лично — без менеджеров</span>
    <h1>Дизайн, аналитика<br>и ИИ-разработка<br>для малого и среднего бизнеса</h1>
    <div class="input"><span style="color:#A1A09F">→</span><input id="q" placeholder="Конкуренты дороже, а покупают у них"><span class="go">↑</span></div>
    <div class="acts"><span class="btn acc">Услуги и решения ↗</span><span class="btn">Обсудить задачу ↗</span></div>
  </div>
</section>
<script>
// Точечная матрица: спокойное поле точек.
// ПК — точки у курсора расходятся, вырастают и вспыхивают оранжевым.
// Телефон — курсора нет: «невидимый палец» сам медленно гуляет по матрице,
// касание пальцем работает как курсор.
const cv = document.getElementById('cv'), cap = document.getElementById('cap'), ctx = cv.getContext('2d')
const TAN = 315 / 957
let W, H, dpr, step, dots = [], mobile
const ptr = { x: -999, y: -999, active: false, t: 0 }
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2)
  W = cap.clientWidth; H = cap.clientHeight
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  mobile = W < 700
  step = mobile ? 16 : 22
  dots = []
  // на ПК матрица справа от текста, на телефоне — полосой внизу
  const x0 = mobile ? 0 : W * 0.48, y0 = mobile ? H - 290 : 0
  const cx0 = mobile ? W * 0.55 : W * 0.72, cy0 = mobile ? H - 145 : H / 2
  for (let y = y0 + step / 2; y < H; y += step) for (let x = x0 + step / 2; x < W; x += step) {
    const sx = cx0 + (cy0 - y) * TAN, d = Math.abs(x - sx)
    const band = mobile ? 34 : 64
    dots.push({ x, y, s: d < band ? 1 - d / band * 0.6 : 0 })
  }
}
function frame(t) {
  t /= 1000
  ctx.clearRect(0, 0, W, H)
  // на телефоне или без мыши — точка «гуляет» сама по восьмёрке
  let px = ptr.x, py = ptr.y
  if (!ptr.active) {
    const bx = mobile ? W * 0.5 : W * 0.72, by = mobile ? H - 145 : H / 2
    px = bx + Math.sin(t * 0.6) * (mobile ? W * 0.35 : W * 0.18)
    py = by + Math.sin(t * 1.2) * (mobile ? 90 : H * 0.28)
  }
  const R = mobile ? 70 : 130
  for (const d of dots) {
    const dx = d.x - px, dy = d.y - py, dist = Math.hypot(dx, dy)
    const near = Math.max(0, 1 - dist / R)
    // точки у курсора расходятся в стороны, вырастают и загораются оранжевым
    const push = near * near * (mobile ? 14 : 22)
    const x = d.x + (dist ? dx / dist * push : 0), y = d.y + (dist ? dy / dist * push : 0)
    const r = 1.6 + near * 3.4
    ctx.fillStyle = near > 0.04 ? `rgba(245,153,88,${0.25 + near * 0.75})` : '#34353A'
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill()
  }
  requestAnimationFrame(frame)
}
cap.addEventListener('pointermove', (e) => { const r = cap.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.active = true })
cap.addEventListener('pointerleave', () => { ptr.active = false })
cap.addEventListener('touchend', () => { ptr.active = false })
addEventListener('resize', layout)
document.fonts.ready.then(() => { layout(); requestAnimationFrame(frame) })
</script>
</body></html>
