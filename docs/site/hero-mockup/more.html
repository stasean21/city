<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face { font-family: Gilroy; src: url(img/Gilroy-Medium.woff2); font-weight: 500; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Semibold.woff2); font-weight: 600; }
@font-face { font-family: Gilroy; src: url(img/Gilroy-Bold.woff2); font-weight: 700; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-cyrillic-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); font-weight: 400; unicode-range: U+0000-00FF; }
@font-face { font-family: Inter; src: url(/home/user/city-main/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; unicode-range: U+0000-00FF; }
:root { --bg:#F6F4F2; --bg-3:#EAE8E4; --ink:#1D1E22; --text:#717171; --text-3:#A1A09F; --accent:#F59958; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; height: 900px; overflow: hidden; position: relative; background: var(--bg); font-family: Inter, sans-serif; color: var(--ink); }
header { position: absolute; z-index: 20; left: 96px; right: 96px; top: 46px; height: 64px; background: #fff; border-radius: 23px; display: flex; align-items: center; padding: 0 8px 0 28px; }
header img { height: 28px; }
header nav { margin-left: auto; display: flex; gap: 48px; font: 500 17px Inter; color: var(--text); margin-right: 40px; }
.btn { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 22px; border-radius: 15px; background: var(--ink); color: #fff; font: 500 17px Inter; white-space: nowrap; }
.btn.sec { background: #fff; color: var(--ink); }
h1 { font: 700 58px/1.12 Gilroy; letter-spacing: -1.5px; }
.sub { font: 400 20px/34px Inter; color: var(--text); }
.acts { display: flex; gap: 14px; }
.abs { position: absolute; }
.cur { position: absolute; z-index: 30; width: 22px; }
.tagname { position: absolute; z-index: 30; padding: 4px 10px; border-radius: 8px 8px 8px 2px; font: 500 13px Inter; color: #fff; }

/* 1 — холст фигмы */
.dotgrid { position: absolute; inset: 0; background-image: radial-gradient(#D8D4CE 1.2px, transparent 1.3px); background-size: 24px 24px; }
.sel { position: absolute; border: 1.5px solid var(--accent); }
.sel i { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--accent); }
.frame-label { position: absolute; font: 500 13px Inter; color: var(--text-3); }
.measure { position: absolute; font: 600 12px Inter; color: #fff; background: var(--accent); padding: 2px 6px; border-radius: 4px; }
.vline { position: absolute; width: 1px; background: var(--accent); }
.hline { position: absolute; height: 1px; background: var(--accent); }

/* 2 — прожектор */
.outline { color: transparent; -webkit-text-stroke: 1.5px #CBC6BF; }

/* 4 — 3D m/ */
.ext { position: absolute; font: 700 470px/1 Gilroy; letter-spacing: -22px; }
</style></head><body>
<header><img src="img/logo-light.svg"><nav><span>Услуги</span><span>Этапы работы</span><span>Отзывы</span><span>Обо мне</span><span>FAQ</span></nav><span class="btn">Обсудить задачу ↗</span></header>
<script>
const v = new URLSearchParams(location.search).get('v') || '1'
const sub = 'Собираю визуал, сайты и автоматизацию так, чтобы всё работало вместе — от первого показа в выдаче до первого заказа.'
const acts = (j = 'center') => `<div class="acts" style="justify-content:${j}"><span class="btn">Услуги и решения ↗</span><span class="btn sec">Обсудить задачу ↗</span></div>`
const cursor = (x, y, name, color = '#1D1E22') => `<svg class="cur" style="left:${x}px;top:${y}px" viewBox="-2 -2 28 40"><path d="M0 0V30L8 23 13 34 18 32 13 21H23Z" fill="${color}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>${name ? `<span class="tagname" style="left:${x + 20}px;top:${y + 30}px;background:${color}">${name}</span>` : ''}`
const H = {
  // 1 — первый экран как холст в Figma
  '1': `<div class="dotgrid"></div>
    <span class="frame-label" style="left:96px;top:148px">Главная — первый экран</span>
    <div class="abs" style="left:0;right:0;top:250px;text-align:center"><h1>Дизайн, аналитика и ИИ-разработка<br>для малого и среднего бизнеса</h1></div>
    <div class="sel" style="left:252px;top:240px;width:936px;height:150px"><i style="left:-6px;top:-6px"></i><i style="right:-6px;top:-6px"></i><i style="left:-6px;bottom:-6px"></i><i style="right:-6px;bottom:-6px"></i></div>
    <span class="measure" style="left:252px;top:216px">H1 · Gilroy Bold 58</span>
    <div class="vline" style="left:720px;top:390px;height:44px"></div><span class="measure" style="left:730px;top:402px">44</span>
    <p class="sub abs" style="left:0;right:0;top:434px;text-align:center;max-width:660px;margin:0 auto">${sub}</p>
    <div class="abs" style="left:0;right:0;top:540px">${acts()}</div>
    <div class="hline" style="left:96px;width:156px;top:316px;opacity:.6"></div><span class="measure" style="left:150px;top:292px">156</span>
    ${cursor(1060, 400, 'Станислав', '#F59958')}${cursor(820, 590, 'Вы', '#1D1E22')}`,
  // 2 — заголовок контуром, под курсором проявляется
  '2': `<div class="abs" style="left:0;right:0;top:230px;text-align:center">
      <h1 class="outline" style="font-size:96px;line-height:1.05;letter-spacing:-3px">Дизайн, аналитика<br>и ИИ-разработка</h1></div>
    <div class="abs" style="left:0;right:0;top:230px;text-align:center;clip-path:circle(170px at 900px 120px)">
      <h1 style="font-size:96px;line-height:1.05;letter-spacing:-3px">Дизайн, аналитика<br>и ИИ-<span style="color:var(--accent)">разработка</span></h1></div>
    <div class="abs" style="left:0;right:0;top:470px;text-align:center"><div style="font:600 30px Gilroy;margin-bottom:18px">для малого и среднего бизнеса</div><p class="sub" style="max-width:660px;margin:0 auto 34px">${sub}</p>${acts()}</div>
    <div class="abs" style="left:730px;top:180px;width:340px;height:340px;border-radius:50%;border:1.5px dashed #D2CDC6"></div>${cursor(900, 350)}`,
  // 3 — огромный логотип-постер снизу
  '3': `<div class="abs" style="left:96px;top:190px;width:760px"><h1 style="font-size:52px">Дизайн, аналитика и ИИ-разработка для малого и среднего бизнеса</h1></div>
    <div class="abs" style="left:900px;top:198px;width:444px"><p class="sub" style="margin-bottom:28px">${sub}</p>${acts('flex-start')}</div>
    <img src="img/logo-light.svg" class="abs" style="left:86px;top:430px;width:1250px">`,
  // 4 — объёмный m/
  '4': `<div class="abs" style="left:96px;top:230px;width:640px"><h1 style="font-size:56px">Дизайн, аналитика<br>и ИИ-разработка<br>для малого и среднего бизнеса</h1><p class="sub" style="margin:26px 0 34px;max-width:520px">${sub}</p>${acts('flex-start')}</div>
    ${Array.from({ length: 22 }, (_, i) => `<div class="ext" style="left:${700 + i * 2}px;top:${230 + i * 2}px;color:${i === 21 ? '#1D1E22' : '#C9C3BB'}">m<span style="color:${i === 21 ? '#F59958' : '#D9844B'}">/</span></div>`).join('')}`,
  // 5 — заголовок рассечён слэшем
  '5': `<div class="abs" style="left:0;right:0;top:220px;text-align:center;clip-path:polygon(0 0, 742px 0, 650px 100%, 0 100%)"><h1 style="font-size:84px;line-height:1.08;letter-spacing:-2.6px">Дизайн, аналитика<br>и ИИ-разработка</h1></div>
    <div class="abs" style="left:0;right:0;top:238px;text-align:center;clip-path:polygon(742px 0, 100% 0, 100% 100%, 650px 100%);transform:translateX(14px)"><h1 style="font-size:84px;line-height:1.08;letter-spacing:-2.6px">Дизайн, аналитика<br>и ИИ-разработка</h1></div>
    <div class="abs" style="left:684px;top:170px;width:30px;height:330px;background:var(--accent);transform:skewX(-16deg)"></div>
    <div class="abs" style="left:0;right:0;top:470px;text-align:center"><div style="font:600 30px Gilroy;margin-bottom:18px">для малого и среднего бизнеса</div><p class="sub" style="max-width:660px;margin:0 auto 34px">${sub}</p>${acts()}</div>`,
}
document.write(H[v])
</script>
</body></html>
